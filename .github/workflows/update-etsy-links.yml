name: Update Etsy links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Etsy listing URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://www.etsy.com/listing/4553470242/homeschool-planner-web-app-multiple-kids'
          new = 'https://www.etsy.com/listing/4557488591/homeschool-planner-web-app-multiple-kids'
          count = s.count(old)
          print(f'Found {count} old Etsy URLs')
          if count == 0:
              raise SystemExit('No old Etsy URL found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit link changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Etsy listing links' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/update-etsy-links.yml
          git commit -m 'Remove temporary Etsy link workflow'
          git push
